[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"

# Room links like /r/xk7q load the app; the router in src/main.ts takes it from there.
[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200
